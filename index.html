<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Tweeny Skin Meta Ads video creatives by Anushka Pandey."
  />
  <title>Video Creatives | Anushka Pandey</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="creative-section">
    <div class="creative-container">
      <header class="section-heading">
        <p class="eyebrow">TWEENY SKIN · META ADS</p>
        <h1>Video Creatives</h1>
        <p class="section-subtitle">
          Performance-focused creative concepts designed for customer acquisition.
        </p>
      </header>

      <section class="video-grid" aria-label="Tweeny Skin video creatives">

        <!-- Creative 01 -->
        <article class="video-card">
          <div class="video-shell">
            <video
              class="creative-video"
              playsinline
              preload="metadata"
              aria-label="Tweeny Skin video creative 1"
            >
              <source src="videos/creative-01.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>

            <button class="play-button" type="button" aria-label="Play video">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6.8v10.4c0 .8.9 1.3 1.6.8l7.5-5.2c.6-.4.6-1.3 0-1.7l-7.5-5.2C9.9 5.5 9 6 9 6.8Z"/>
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="6" width="3.5" height="12" rx="1"/>
                <rect x="13.5" y="6" width="3.5" height="12" rx="1"/>
              </svg>
            </button>

            <div class="video-controls">
              <div class="progress-track" aria-hidden="true">
                <div class="progress-bar"></div>
              </div>

              <button class="volume-button" type="button" aria-label="Unmute video">
                <svg class="volume-on" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path class="volume-wave" d="M15 9a4.2 4.2 0 0 1 0 6"/>
                </svg>
                <svg class="volume-off" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path d="m16 9 4 6M20 9l-4 6"/>
                </svg>
              </button>
            </div>

            <div class="video-overlay"></div>
          </div>
        </article>

        <!-- Creative 02 -->
        <article class="video-card">
          <div class="video-shell">
            <video
              class="creative-video"
              playsinline
              preload="metadata"
              aria-label="Tweeny Skin video creative 2"
            >
              <source src="videos/creative-02.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>

            <button class="play-button" type="button" aria-label="Play video">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6.8v10.4c0 .8.9 1.3 1.6.8l7.5-5.2c.6-.4.6-1.3 0-1.7l-7.5-5.2C9.9 5.5 9 6 9 6.8Z"/>
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="6" width="3.5" height="12" rx="1"/>
                <rect x="13.5" y="6" width="3.5" height="12" rx="1"/>
              </svg>
            </button>

            <div class="video-controls">
              <div class="progress-track" aria-hidden="true">
                <div class="progress-bar"></div>
              </div>

              <button class="volume-button" type="button" aria-label="Unmute video">
                <svg class="volume-on" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path class="volume-wave" d="M15 9a4.2 4.2 0 0 1 0 6"/>
                </svg>
                <svg class="volume-off" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path d="m16 9 4 6M20 9l-4 6"/>
                </svg>
              </button>
            </div>

            <div class="video-overlay"></div>
          </div>
        </article>

        <!-- Creative 03 -->
        <article class="video-card">
          <div class="video-shell">
            <video
              class="creative-video"
              playsinline
              preload="metadata"
              aria-label="Tweeny Skin video creative 3"
            >
              <source src="videos/creative-03.mp4" type="video/mp4" />
              Your browser does not support HTML5 video.
            </video>

            <button class="play-button" type="button" aria-label="Play video">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6.8v10.4c0 .8.9 1.3 1.6.8l7.5-5.2c.6-.4.6-1.3 0-1.7l-7.5-5.2C9.9 5.5 9 6 9 6.8Z"/>
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="6" width="3.5" height="12" rx="1"/>
                <rect x="13.5" y="6" width="3.5" height="12" rx="1"/>
              </svg>
            </button>

            <div class="video-controls">
              <div class="progress-track" aria-hidden="true">
                <div class="progress-bar"></div>
              </div>

              <button class="volume-button" type="button" aria-label="Unmute video">
                <svg class="volume-on" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path class="volume-wave" d="M15 9a4.2 4.2 0 0 1 0 6"/>
                </svg>
                <svg class="volume-off" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 9.2v5.6h3.3l4.2 3.5V5.7L7.8 9.2H4.5Z"/>
                  <path d="m16 9 4 6M20 9l-4 6"/>
                </svg>
              </button>
            </div>

            <div class="video-overlay"></div>
          </div>
        </article>

      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
